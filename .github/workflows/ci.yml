name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Docker environment
        run: |
          echo "POSTGRES_DB=pizza" >> .env
          echo "POSTGRES_USER=pizza" >> .env
          echo "POSTGRES_PASSWORD=pizza" >> .env
          echo "POSTGRES_PORT=5432" >> .env
          echo "NGINX_PORT=8080" >> .env

      - name: Build Docker images
        run: docker compose build

  code-quality:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Docker environment
        run: |
          echo "POSTGRES_DB=pizza" >> .env
          echo "POSTGRES_USER=pizza" >> .env
          echo "POSTGRES_PASSWORD=pizza" >> .env
          echo "POSTGRES_PORT=5432" >> .env
          echo "NGINX_PORT=8080" >> .env

      - name: Prepare Laravel environment
        run: cp application/.env.example application/.env

      - name: Start containers
        run: docker compose up -d

      - name: Install dependencies
        run: docker compose exec -T -u root php composer install

      - name: Fix Laravel permissions
        run: |
          docker compose exec -T -u root php chown www-data:www-data /var/www/application/.env
          docker compose exec -T -u root php chown -R www-data:www-data /var/www/application/storage
          docker compose exec -T -u root php chown -R www-data:www-data /var/www/application/bootstrap/cache

      - name: Generate app key
        run: docker compose exec -T php php artisan key:generate

      - name: Generate JWT secret
        run: docker compose exec -T php php artisan jwt:secret --force

      - name: Run migrations
        run: docker compose exec -T php php artisan migrate --force

      - name: Run tests
        run: docker compose exec -T php php artisan test

      - name: Run PHP CS Fixer
        run: docker compose exec -T php vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run PHPStan
        run: docker compose exec -T php vendor/bin/phpstan analyse --memory-limit=512M

      - name: Run Rector
        run: docker compose exec -T php vendor/bin/rector process --dry-run