services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev

    working_dir: /var/www/application

    volumes:
      - ./application:/var/www/application

    environment:
      APP_ENV: dev

    ports:
      - "${PHP_PORT}:9000"

    depends_on:
      - postgres

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: pizza
      POSTGRES_USER: pizza
      POSTGRES_PASSWORD: pizza

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "${POSTGRES_PORT}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizza -d pizza"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27

    ports:
      - "${NGINX_PORT}:80"

    volumes:
      - ./application:/var/www/application
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php

volumes:
  postgres_data: